name: release-jar

# Builds the release jar when a version tag is pushed. It only uploads a workflow
# artifact: it does not create a GitHub release or publish to Modrinth/CurseForge.
on:
  push:
    tags: ['v*']

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Tag matches the mod version
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version=$version in gradle.properties" >&2
            exit 1
          fi
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: t3craft-jar
          path: build/libs/t3craft-*.jar
          if-no-files-found: error
